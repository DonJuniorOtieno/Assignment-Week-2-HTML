<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abduction Alert System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Abduction Alert System</h1>
        </header>

        <section id="sos-section">
            <button id="sos-button" class="sos-btn">SOS - SEND ALERT</button>
            <div id="alert-status" class="alert-status"></div>
        </section>

        <section id="contacts-section">
            <h2>Emergency Contacts</h2>
            <form id="contact-form">
                <div class="form-group">
                    <label for="contact-name">Name:</label>
                    <input type="text" id="contact-name" placeholder="Enter name" required>
                </div>
                <div class="form-group">
                    <label for="contact-detail">Contact Detail:</label>
                    <input type="text" id="contact-detail" placeholder="Enter phone or email" required>
                </div>
                <button type="submit">Add Contact</button>
            </form>

            <ul id="contact-list">
                <!-- Contacts will be added here -->
            </ul>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
